[project]
name = "kh-h3-atlas"
version = "0.1.0"
description = "Cambodia H3 hexagon atlas: population and POI features per cell"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.3",
    "h3>=4.1",
    "numpy>=1.26",
    "pyarrow>=16",
    "pydantic>=2.7",
    "pyyaml>=6",
    "rasterio>=1.4",
    "typer>=0.12",
]

[project.scripts]
kh-atlas = "kh_h3_atlas.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kh_h3_atlas"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access (deselect with -m 'not network')"]
